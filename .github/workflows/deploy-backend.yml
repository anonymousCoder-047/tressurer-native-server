name: Deploy backend to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            # First run: nothing is cloned yet — clone into ~/tressurer.
            if [ ! -d ~/tressurer/.git ]; then
              git clone https://github.com/${{ github.repository }}.git ~/tressurer
            fi
            cd ~/tressurer
            bash deploy/deploy.sh
